name: Staging deploy (reusable)

# Real staging deploy: Cloudflare Workers via the Wrangler CLI — a pinned CLI
# dependency, not a third-party action (docs/RECOMMENDED_ACTIONS.md). The step
# below fails at an explicit provisioning gate until the per-environment
# Cloudflare resources exist; wrangler.jsonc carries placeholders until a
# technical admin records the real identifiers.
#
# Reusable workflow: it is called by another workflow, never triggered directly.
# Called by: .github/workflows/deploy.yml

on:
  workflow_call:
    inputs:
      commit-sha:
        description: >-
          Full 40-character SHA to deploy. This is the identity of the release;
          it is validated below and must not be a branch or tag name.
        type: string
        required: true
      environment:
        description: Name of the GitHub Environment holding staging credentials.
        type: string
        default: staging
      runner:
        description: Runner label to execute on.
        type: string
        default: ubuntu-latest
    outputs:
      url:
        description: Base URL the deployment is reachable at, for the health check.
        value: ${{ jobs.deploy.outputs.url }}

# ── Where the deploy credential comes from ───────────────────────────────────
# Store it as a secret on the GitHub Environment named by the `environment`
# input (Settings → Environments → staging → Add secret), then read it in the
# deploy step below as ${{ secrets.<NAME> }}.
#
# It is read here rather than passed in by the caller because `environment:` is
# not allowed on a job that calls a reusable workflow — so a caller job cannot
# see environment-scoped secrets, and forwarding one would pass an empty string
# with no error. The job below binds the environment, so it can read them.
#
# Use the SAME secret name on the staging and production Environments with
# different values. That is what keeps a staging run unable to read production
# credentials: the environment binding, not the secret's name.
#
# NOT YET VERIFIED. This design is sound in principle but has not been exercised
# in a real repository. An unset or unreachable secret resolves to an EMPTY STRING
# rather than failing, so a misplaced secret looks like working config.
#
# Verify in GitHub with a DUMMY, NON-PRODUCTION value: put a throwaway secret on
# the staging Environment, echo its length (never its value) from this job, and
# confirm the length is non-zero. Do not use a real credential for this test.
# ─────────────────────────────────────────────────────────────────────────────

# Least privilege: deny everything here, grant the minimum per job.
permissions: {}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    # Binds the job to the GitHub Environment, which is where staging secrets and
    # any protection rules live.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read # required only so actions/checkout can read the repository
      # id-token: write  # ONLY if the provider supports OIDC. Prefer this over a
      #   long-lived stored token: the job exchanges a short-lived credential at
      #   run time, so there is nothing standing to leak. The caller must grant
      #   it too — a called workflow cannot widen the caller's token.
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Validate commit SHA
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
        run: |
          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error title=Invalid commit SHA::Expected a full 40-character lowercase hex SHA, got '$COMMIT_SHA'."
            echo "A branch or tag name would let the deployed code drift from the reviewed code."
            exit 1
          fi
          echo "Deploying commit $COMMIT_SHA"

      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        # Pinned to a full commit SHA, not the mutable @v7 tag. Published by
        # GitHub; see docs/RECOMMENDED_ACTIONS.md.
        with:
          ref: ${{ inputs.commit-sha }}
          persist-credentials: false

      # ── CUSTOMIZE ─────────────────────────────────────────────────────────
      # Real staging deploy: build the checked-out SHA and deploy it to the
      # Cloudflare Workers staging environment with the Wrangler CLI.
      #
      # Credentials and the public URL come from the staging Environment:
      #   secrets.CLOUDFLARE_API_TOKEN   Workers deploy + D1 migration scope
      #   secrets.CLOUDFLARE_ACCOUNT_ID
      #   vars.DEPLOY_BASE_URL           deployed base URL, for the health probe
      # Runtime configuration (MOBIUS_*, ACCESS_*, OPENAI_API_KEY,
      # HELIX_GITHUB_READ_TOKEN, HELIX_GITHUB_WRITE_TOKEN) is set with
      # `wrangler secret put` at provisioning time, never in this workflow.
      #
      # D1 migrations run before the deploy; record database_migration: true in
      # the release metadata and keep rollback_safe honest — D1 has no
      # point-in-time rollback of an applied migration.
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
        run: |
          set -euo pipefail

          if grep -q "REPLACE_AFTER_PROVISIONING" wrangler.jsonc; then
            echo "::error title=Provisioning incomplete::wrangler.jsonc still contains REPLACE_AFTER_PROVISIONING identifiers."
            echo "Per-environment Cloudflare provisioning is not recorded yet; see README →"
            echo "'The blocking dependencies'. A technical admin replaces the placeholders"
            echo "and records the result in .helix/project.json before this step can run."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=Deploy credential missing::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets on the staging Environment."
            exit 1
          fi
          if [ -z "${DEPLOY_BASE_URL:-}" ]; then
            echo "::error title=No URL::Set the DEPLOY_BASE_URL variable on the staging Environment so staging-health-check has something to probe."
            exit 1
          fi

          npm ci
          npm run build
          npm run db:migrate:staging
          npm run deploy:staging
          echo "url=$DEPLOY_BASE_URL" >> "$GITHUB_OUTPUT"
      # ──────────────────────────────────────────────────────────────────────
