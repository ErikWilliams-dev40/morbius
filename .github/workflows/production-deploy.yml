name: Production deploy (reusable)

# Real production deploy: Cloudflare Workers via the Wrangler CLI. The deploy
# step below fails at an explicit provisioning gate until the per-environment
# Cloudflare resources exist (wrangler.jsonc placeholders).
#
# The approval-integrity guard below is FUNCTIONAL as shipped, and is the point
# where commit-SHA immutability is enforced: the workflow refuses to deploy
# anything other than the exact commit that was approved.
#
# Reusable workflow: it is called by another workflow, never triggered directly.
# Called by: .github/workflows/deploy.yml

on:
  workflow_call:
    inputs:
      commit-sha:
        description: Full 40-character SHA to deploy.
        type: string
        required: true
      approved-sha:
        description: >-
          Full 40-character SHA recorded in the release metadata that the
          reviewers signed off on. Must equal commit-sha.
        type: string
        required: true
      environment:
        description: >-
          GitHub Environment holding production credentials. Its required-reviewer
          rule is the business-approval gate — the run pauses here until a
          reviewer approves.
        type: string
        default: production
      runner:
        description: Runner label to execute on.
        type: string
        default: ubuntu-latest
    outputs:
      url:
        description: Base URL the deployment is reachable at, for the health check.
        value: ${{ jobs.deploy.outputs.url }}

# Deploy credentials are read from the Environment named by the `environment`
# input, not passed in by the caller. See the full explanation in
# staging-deploy.yml — the short version is that a job calling a reusable
# workflow cannot declare an environment, so it cannot read environment secrets,
# and forwarding one would silently pass an empty string.

# Least privilege: deny everything here, grant the minimum per job.
permissions: {}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    # Binds the job to the GitHub Environment. Required reviewers configured
    # there hold the run before any step executes — that is the business
    # approval gate. It is enforced by GitHub, not by this file.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read # required only so actions/checkout can read the repository
      # id-token: write  # ONLY if the provider supports OIDC. Prefer this over a
      #   long-lived stored token. The caller must grant it too — a called
      #   workflow cannot widen the caller's token.
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # ── Approval integrity ────────────────────────────────────────────────
      # An executive approval refers to one exact version of the code. If the
      # SHA being deployed differs from the SHA that was reviewed — because a
      # branch moved, a PR was amended, or the wrong value was pasted — the
      # approval no longer describes what would ship. Refuse, do not warn.
      #
      # Limitation, stated plainly: this compares two values supplied to the
      # run. It catches drift and paste errors, not an operator who enters the
      # same wrong SHA in both fields. `approved-sha` must be READ from the
      # release metadata record, never retyped from memory. The gate that stops
      # a determined operator is the Environment reviewer below, not this step.
      - name: Verify the deploy target matches the approved commit
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
          APPROVED_SHA: ${{ inputs.approved-sha }}
        run: |
          set -euo pipefail

          for pair in "COMMIT_SHA:$COMMIT_SHA" "APPROVED_SHA:$APPROVED_SHA"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if ! printf '%s' "$value" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error title=Invalid $name::Expected a full 40-character lowercase hex SHA, got '$value'."
              echo "A branch or tag name can move, so it cannot identify an approved release."
              exit 1
            fi
          done

          if [ "$COMMIT_SHA" != "$APPROVED_SHA" ]; then
            echo "::error title=Approval mismatch::Refusing to deploy."
            echo "  approved: $APPROVED_SHA"
            echo "  requested: $COMMIT_SHA"
            echo "The approval on record does not cover the requested commit."
            echo "Re-run the review gates against $COMMIT_SHA and record a new release."
            exit 1
          fi

          echo "Approved commit confirmed: $COMMIT_SHA"

      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        # Pinned to a full commit SHA, not the mutable @v7 tag. Published by
        # GitHub; see docs/RECOMMENDED_ACTIONS.md.
        with:
          ref: ${{ inputs.commit-sha }}
          persist-credentials: false

      # ── CUSTOMIZE ─────────────────────────────────────────────────────────
      # Real production deploy: build the checked-out SHA and deploy it to the
      # Cloudflare Workers production environment with the Wrangler CLI.
      #
      # Honest note: this rebuilds the reviewed SHA here rather than promoting
      # the staging artifact. Passing the exact verified bytes between jobs is
      # an improvement left open in docs/RECOMMENDED_ACTIONS.md.
      #
      # Credentials and the public URL come from the production Environment:
      #   secrets.CLOUDFLARE_API_TOKEN   Workers deploy + D1 migration scope
      #   secrets.CLOUDFLARE_ACCOUNT_ID
      #   vars.DEPLOY_BASE_URL           deployed base URL, for the health probe
      # Runtime configuration is set with `wrangler secret put` at provisioning
      # time, never in this workflow.
      #
      # D1 migrations run before the deploy; record database_migration: true in
      # the release metadata and keep rollback_safe honest — D1 has no
      # point-in-time rollback of an applied migration.
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
        run: |
          set -euo pipefail

          if grep -q "REPLACE_AFTER_PROVISIONING" wrangler.jsonc; then
            echo "::error title=Provisioning incomplete::wrangler.jsonc still contains REPLACE_AFTER_PROVISIONING identifiers."
            echo "Per-environment Cloudflare provisioning is not recorded yet; see README →"
            echo "'The blocking dependencies'. A technical admin replaces the placeholders"
            echo "and records the result in .helix/project.json before this step can run."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=Deploy credential missing::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets on the production Environment."
            exit 1
          fi
          if [ -z "${DEPLOY_BASE_URL:-}" ]; then
            echo "::error title=No URL::Set the DEPLOY_BASE_URL variable on the production Environment so production-health-check has something to probe."
            exit 1
          fi

          npm ci
          npm run build
          npm run db:migrate:production
          npm run deploy:production
          echo "url=$DEPLOY_BASE_URL" >> "$GITHUB_OUTPUT"
      # ──────────────────────────────────────────────────────────────────────
